[project]
name = "sciverse-agent-tools"
version = "0.3.0"
description = "SciVerse Agent Tools — OpenAI/Anthropic/LangChain compatible tool schema and async client for SciVerse retrieval APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SciVerse Platform Team" }]
keywords = ["sciverse", "agent", "llm", "tool-calling", "scientific-papers"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://github.com/opendatalab/SciVerse-agent-tools"
Repository = "https://github.com/opendatalab/SciVerse-agent-tools.git"
Documentation = "https://github.com/opendatalab/SciVerse-agent-tools#readme"
Changelog = "https://github.com/opendatalab/SciVerse-agent-tools/blob/main/CHANGELOG.md"
Issues = "https://github.com/opendatalab/SciVerse-agent-tools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciverse_agent_tools"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
]
