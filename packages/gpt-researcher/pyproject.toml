[project]
name = "gpt-researcher-sciverse"
version = "0.1.0"
description = "Sciverse scientific literature passage retriever plugin for GPT Researcher"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sciverse Platform Team" }]
dependencies = ["gpt-researcher>=0.16.1", "requests>=2.32.3"]

[project.entry-points."gpt_researcher.retrievers"]
sciverse = "gpt_researcher_sciverse:SciverseSearch"

[project.urls]
Repository = "https://github.com/opendatalab/Sciverse-Agent-Tools"
Issues = "https://github.com/opendatalab/Sciverse-Agent-Tools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_researcher_sciverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
