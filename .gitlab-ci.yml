.agent-tools-changes: &agent-tools-changes
  changes:
    - agent-tools/**/*

# CI 环境无法直连公网 PyPI / npm，统一走阿里云 / npmmirror。
# release job 单独处理 npm publish（必须发布到 npmjs.org）。
.agent-tools-mirror-vars: &agent-tools-mirror-vars
  PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
  UV_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"

agent-tools:lint-openapi:
  stage: test
  image: docker.shlab.tech/public/node:20.15.0-buster
  variables:
    <<: *agent-tools-mirror-vars
  rules:
    - if: $CI_MERGE_REQUEST_IID
      <<: *agent-tools-changes
    - if: $CI_COMMIT_BRANCH
      <<: *agent-tools-changes
  script:
    - cd agent-tools
    - npx --yes @stoplight/spectral-cli@6 lint openapi.yaml

agent-tools:test-python:
  stage: test
  image: docker.shlab.tech/public/python:3.13-slim
  variables:
    <<: *agent-tools-mirror-vars
  rules:
    - if: $CI_MERGE_REQUEST_IID
      <<: *agent-tools-changes
    - if: $CI_COMMIT_BRANCH
      <<: *agent-tools-changes
  script:
    - pip install --quiet uv
    - cd agent-tools
    - uv sync
    - uv run pytest tests/ -v
    - cd packages/python
    - uv venv --python 3.13
    - uv sync
    - uv run pytest tests/ -v --ignore tests/test_contract.py

agent-tools:test-typescript:
  stage: test
  image: docker.shlab.tech/public/node:20.15.0-buster
  variables:
    <<: *agent-tools-mirror-vars
  rules:
    - if: $CI_MERGE_REQUEST_IID
      <<: *agent-tools-changes
    - if: $CI_COMMIT_BRANCH
      <<: *agent-tools-changes
  script:
    - cd agent-tools/packages/typescript
    - npm ci
    - npm run typecheck
    - npx vitest run --exclude 'tests/contract.test.ts'

agent-tools:drift-check:
  stage: test
  image: docker.shlab.tech/public/python:3.13-slim
  variables:
    <<: *agent-tools-mirror-vars
  rules:
    - if: $CI_MERGE_REQUEST_IID
      <<: *agent-tools-changes
  script:
    # CI 不通 deb.debian.org，把 apt sources 切到阿里云镜像
    - sed -i 's|deb.debian.org|mirrors.aliyun.com|g; s|security.debian.org|mirrors.aliyun.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
    - apt-get update && apt-get install -y --no-install-recommends git nodejs npm
    - pip install --quiet uv
    - cd agent-tools
    - uv sync
    - cd packages/typescript && npm ci && cd ../..
    - bash scripts/build.sh
    - cd ..
    - |
      if ! git diff --exit-code agent-tools/dist agent-tools/packages/python/src/sciverse_agent_tools/types.py agent-tools/packages/python/src/sciverse_agent_tools/tools.py agent-tools/packages/typescript/src/types.ts agent-tools/packages/typescript/src/tools.ts agent-tools/packages/typescript/package.json agent-tools/packages/python/pyproject.toml agent-tools/skill/SKILL.md agent-tools/skill/manifest.json; then
          echo ""
          echo "派生产物未同步，请本地运行 bash agent-tools/scripts/build.sh 后提交"
          exit 1
      fi

agent-tools:version-check:
  stage: test
  image: docker.shlab.tech/public/python:3.13-slim
  variables:
    <<: *agent-tools-mirror-vars
  rules:
    - if: $CI_MERGE_REQUEST_IID
      <<: *agent-tools-changes
  script:
    - pip install --quiet pyyaml
    - |
      python <<'PY'
      import json, yaml
      from pathlib import Path
      root = Path("agent-tools")
      v_yaml = yaml.safe_load((root / "openapi.yaml").read_text())["info"]["version"]
      v_py = next(line.split('"')[1] for line in (root / "packages/python/pyproject.toml").read_text().splitlines() if line.startswith("version"))
      v_ts = json.loads((root / "packages/typescript/package.json").read_text())["version"]
      assert v_yaml == v_py == v_ts, f"version mismatch: openapi={v_yaml}, py={v_py}, ts={v_ts}"
      print(f"version OK: {v_yaml}")
      PY

agent-tools:contract:
  stage: test
  image: docker.shlab.tech/public/python:3.13-slim
  rules:
    - if: $CI_MERGE_REQUEST_IID
      <<: *agent-tools-changes
    - if: $CI_COMMIT_BRANCH == "dev"
      <<: *agent-tools-changes
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    <<: *agent-tools-mirror-vars
    SCIVERSE_TEST_BASE_URL: "https://sciverse-dev.opendatalab.org.cn/api"
  script:
    - |
      if [ -z "${SCIVERSE_TEST_TOKEN:-}" ]; then
          echo "::warning:: SCIVERSE_TEST_TOKEN 未配置，契约测试将全部 skip。"
          echo "请在 GitLab Project Settings → CI/CD → Variables 配置 (masked + protected)。"
      fi
    - pip install --quiet uv
    - cd agent-tools/packages/python
    - uv venv --python 3.13
    - uv sync
    - uv run pytest tests/test_contract.py -v

agent-tools:release:
  stage: publish
  image: docker.shlab.tech/public/python:3.13-slim
  # 不引用 mirror-vars：npm publish 必须发到 npmjs.org（默认 registry）。
  # 装包用 mirror，发布走默认。
  allow_failure: true  # 发布失败不阻塞后续 release/deploy stage
  variables:
    PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
    UV_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      <<: *agent-tools-changes
  before_script:
    - pip install --quiet uv twine pyyaml
    # CI 不通 deb.debian.org，把 apt sources 切到阿里云镜像
    - sed -i 's|deb.debian.org|mirrors.aliyun.com|g; s|security.debian.org|mirrors.aliyun.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
    - apt-get update && apt-get install -y --no-install-recommends nodejs npm git
  script:
    - cd agent-tools
    - VERSION=$(python -c "import yaml; print(yaml.safe_load(open('openapi.yaml'))['info']['version'])")
    - echo "Releasing sciverse-agent-tools v${VERSION}"
    # 检查 git tag 是否已存在，存在则跳过（幂等）
    # tag 用 `agent-tools-v` 前缀避免与 monorepo 整体 tag (`v1.x.y`) 命名空间冲突
    - |
      if git rev-parse "agent-tools-v${VERSION}" >/dev/null 2>&1; then
          echo "tag agent-tools-v${VERSION} already exists, skipping release"
          exit 0
      fi
    # PyPI
    - cd packages/python
    - uv venv --python 3.13
    - uv sync
    - uv build
    - twine upload --skip-existing --non-interactive --username __token__ --password "${PYPI_API_TOKEN}" dist/*
    - cd ../..
    # npm（装 deps 走 mirror，publish 走 npmjs.org）
    - cd packages/typescript
    - npm ci --registry=https://registry.npmmirror.com
    - npm run build
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish --access public --registry=https://registry.npmjs.org
    - cd ../..
    # tag
    - git config user.email "ci@gitlab.shlab.tech"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://oauth2:${GL_TOKEN}@gitlab.shlab.tech/${CI_PROJECT_PATH}.git"
    - git tag -a "agent-tools-v${VERSION}" -m "agent-tools v${VERSION}"
    - git push origin "agent-tools-v${VERSION}"

agent-tools:publish-skill:
  stage: publish
  image: docker.shlab.tech/public/node:20.15.0-buster
  allow_failure: true  # ClawHub 发布失败不阻塞后续 release/deploy stage
  variables:
    <<: *agent-tools-mirror-vars
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - agent-tools/skill/**/*
        - agent-tools/openapi.yaml
  script:
    # 把 skill bundle 复制到非 git 目录后再 publish。
    # 否则 ClawHub CLI 会从 .git 检测到 GitLab remote（非 GitHub 格式），
    # 触发 "--source-repo and --source-commit must be set together" 错误。
    # 复制后 CLI 找不到 .git context，干净跳过 source 元数据。
    # v0.2 迁到 GitHub mirror 后改回从仓库目录直发并加 --source-repo flag。
    - cp -r agent-tools/skill /tmp/sciverse-agent-tools-skill
    - cd /tmp/sciverse-agent-tools-skill
    - VERSION=$(node -e "console.log(require('./manifest.json').version)")
    - echo "Publishing sciverse-agent-tools skill v${VERSION} to ClawHub"
    - |
      if [ -z "${CLAWHUB_TOKEN:-}" ]; then
          echo "::warning:: CLAWHUB_TOKEN 未配置，skill 发布跳过。"
          echo "请在 GitLab Project Settings → CI/CD → Variables 配置 CLAWHUB_TOKEN（masked + protected）。"
          exit 0
      fi
    # ClawHub CLI 不读 env var，必须先 `clawhub login --token` 写入本地 config，
    # 之后 publish 才能识别身份。
    # CI runner 出口到 clawhub.ai 偶发不稳，login token 验证 15s 超时，加 3 次重试。
    - |
      for i in 1 2 3; do
        if npx --yes clawhub@latest login --token "${CLAWHUB_TOKEN}"; then
          echo "ClawHub login succeeded on attempt $i"
          break
        fi
        if [ "$i" = "3" ]; then
          echo "ClawHub login failed after 3 attempts"
          exit 1
        fi
        echo "Login attempt $i failed, retrying in 10s..."
        sleep 10
      done
    # --family skill 显式声明包类型（CLI 无法从 manifest 自动检测时必填）
    # publish 也加重试（同样的网络抖动可能影响）
    - |
      for i in 1 2 3; do
        if npx --yes clawhub@latest package publish . --family skill --version "${VERSION}" --tags latest; then
          echo "ClawHub publish succeeded on attempt $i"
          break
        fi
        if [ "$i" = "3" ]; then
          echo "ClawHub publish failed after 3 attempts"
          exit 1
        fi
        echo "Publish attempt $i failed, retrying in 10s..."
        sleep 10
      done

# 单向 sync agent-tools/ 子目录到 GitHub 公开 mirror (opendatalab/SciVerse-agent-tools)。
# 主仓库（本 GitLab repo）是权威源，mirror 仅供社区审计 / ClawHub source 链接。
# - GIT_DEPTH=0：默认 shallow clone 不够 subtree split 抽完整历史。
# - allow_failure：mirror sync 抽风不影响 release / publish-skill。
# - 仅 main 触发，与其他 publish job 节奏一致；mirror = 稳定版，不暴露 dev 中间态。
# 配置：在 GitLab Settings → CI/CD → Variables 加 GITHUB_MIRROR_TOKEN (masked + protected)，
# 值为 GitHub fine-grained PAT，权限 opendatalab/SciVerse-agent-tools Contents:R&W。
agent-tools:mirror-sync:
  stage: publish
  image: docker.shlab.tech/public/node:20.15.0-buster
  allow_failure: true
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      <<: *agent-tools-changes
  script:
    - |
      if [ -z "${GITHUB_MIRROR_TOKEN:-}" ]; then
          echo "::warning:: GITHUB_MIRROR_TOKEN 未配置，mirror sync 跳过。"
          echo "请在 GitLab Project Settings → CI/CD → Variables 配置（masked + protected）。"
          exit 0
      fi
    - git config user.email "ci@gitlab.shlab.tech"
    - git config user.name "GitLab CI Mirror"
    # subtree split：抽 agent-tools/ 子目录的独立历史到临时分支 mirror-sync
    - git subtree split --prefix=agent-tools -b mirror-sync
    # 单向 mirror：用 --force（subtree SHA 因 commit graph 微变可能与上次不同，
    # 公开仓库无人会反向 push，安全覆盖）。
    - git push --force "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/opendatalab/SciVerse-agent-tools.git" mirror-sync:main
